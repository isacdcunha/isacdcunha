name: Cards do README

on:
  schedule:
    - cron: "0 3 * * *"   # todo dia às 3h (UTC)
  workflow_dispatch:      # botão pra rodar na mão

permissions:
  contents: write

jobs:
  cobrinha:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/cobrinha.svg?color_snake=#2B3AB0&color_dots=#ebedf0,#9be9a8,#40c463,#30a14e,#216e39
            dist/cobrinha-dark.svg?palette=github-dark&color_snake=#E8FF5C

      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  estatisticas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: readme-tools/github-readme-stats-action@v1
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&hide_border=true&bg_color=F4F3EE&title_color=2B3AB0&icon_color=C2311F&text_color=1B1B1F&locale=pt-br
          path: profile/stats.svg
          token: ${{ secrets.README_STATS_TOKEN }}

      - uses: readme-tools/github-readme-stats-action@v1
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=6&hide_border=true&bg_color=F4F3EE&title_color=2B3AB0&text_color=1B1B1F&locale=pt-br
          path: profile/top-langs.svg
          token: ${{ secrets.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 }}

      - name: Salvar os cards
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Atualiza cards do README" || exit 0
          git push
